name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          build() {
            arch="$1"; name="$2"; goarm="${3:-}"
            GOOS=linux GOARCH="$arch" GOARM="$goarm" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X wdev/internal/version.Version=${tag}" \
              -o "dist/wdev-linux-${name}" ./cmd/wdev
          }
          build amd64 amd64
          build arm64 arm64
          build arm armv7 7
          cd dist
          for f in wdev-linux-*; do
            [ -f "$f.sha256" ] && continue
            sha256sum "$f" > "$f.sha256"
          done
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Jika release sudah dibuat via script, upload assets ke release tersebut. Jika belum, buat baru.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "wdev ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
