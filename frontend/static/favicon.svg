<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <title>wdev Control Plane</title>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#0E1726" stroke="#222C3C" stroke-width="2.5" />
  <!-- Left outer cobalt leg -->
  <polygon points="19.6,25.2 14.1,38.5 28.8,71.9 34.4,59.2" fill="#216BFB" />
  <!-- Left inner cyan ribbon -->
  <polygon points="22.6,25.0 32.3,25.0 41.9,46.6 36.6,57.5" fill="#35CDFE" />
  <!-- Upper-center cobalt bridge -->
  <polygon points="44.1,25.0 52.5,25.0 43.3,44.2 39.6,35.6" fill="#216BFB" />
  <!-- Center ascending cobalt shaft + cyan crown (0.25 unit overlap avoids anti-alias seam) -->
  <polygon points="30.8,74.9 42.2,74.9 55.4,45.3 50.1,36.8" fill="#216BFB" />
  <polygon points="50.1,36.9 55.8,25.0 60.1,34.8 55.3,45.6" fill="#35CDFE" />
  <!-- Right-inner downward ribbon (cobalt top, cyan fold, cobalt tip) -->
  <polygon points="67.4,25.0 77.2,25.0 66.7,49.0 61.7,37.6" fill="#216BFB" />
  <polygon points="61.8,37.7 66.8,48.8 62.0,60.0 56.9,48.6" fill="#35CDFE" />
  <polygon points="57.0,48.8 62.1,59.8 57.0,71.9 51.7,59.8" fill="#216BFB" />
  <!-- Right outer cyan wing -->
  <polygon points="80.3,25.2 85.8,38.5 70.2,74.9 59.0,74.9" fill="#35CDFE" />
</svg>
